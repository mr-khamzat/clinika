[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: быстрые тесты без I/O (mock_db, in-memory ORM объекты).
    integration: интеграционные тесты — требуют PostgreSQL (testcontainers) и Docker.
    slow: длительные сценарии (> 1с): миграции, нагрузочные.
filterwarnings =
    ignore::DeprecationWarning
