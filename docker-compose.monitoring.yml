# КлиникСеть — стек мониторинга.
# uptime-kuma управляется отдельно (docker run, не compose) — не описан здесь.
# Запуск: docker compose -f docker-compose.monitoring.yml --profile metrics up -d

services:
  # ── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    profiles: ["metrics"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/blackbox.yml:/etc/prometheus/blackbox.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-net
      - clinika-default

  # ── PostgreSQL exporter ──────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    profiles: ["metrics"]
    environment:
      DATA_SOURCE_NAME: "postgresql://clinika:clinika_pass@clinika-db:5432/clinika?sslmode=disable"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - monitoring-net
      - clinika-default
    depends_on:
      - prometheus

  # ── Redis exporter ───────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    profiles: ["metrics"]
    environment:
      REDIS_ADDR: "redis://clinika-redis:6379"
    healthcheck:
      test: ["CMD", "/redis_exporter", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - monitoring-net
      - clinika-default
    depends_on:
      - prometheus

  # ── Node exporter (метрики хоста через /proc и /sys mounts) ──────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    profiles: ["metrics"]
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - monitoring-net

  # ── cAdvisor (метрики Docker-контейнеров) ────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    profiles: ["metrics"]
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
    networks:
      - monitoring-net

  # ── Blackbox exporter (HTTP/TCP пробы) ───────────────────────────────────
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    profiles: ["metrics"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    networks:
      - monitoring-net

volumes:
  prometheus-data:

networks:
  monitoring-net:
    driver: bridge
  clinika-default:
    external: true
    name: clinika_clinika-net
