# КлиникСеть — стек мониторинга.
# uptime-kuma описан здесь (status-page + Telegram alerts).
# Запуск: docker compose -f docker-compose.monitoring.yml --profile metrics up -d

services:
  # ── Uptime-Kuma: status-page + Telegram alerts ───────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma:/app/data
    mem_limit: 256m
    cpus: 0.5
    networks:
      - monitoring-net

  # ── Prometheus: time-series база метрик ──────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    profiles: ["metrics"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/blackbox.yml:/etc/prometheus/blackbox.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-net
      - clinika-default

  # ── PostgreSQL exporter ──────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    profiles: ["metrics"]
    environment:
      DATA_SOURCE_NAME: "postgresql://clinika:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@clinika-db:5432/clinika?sslmode=disable"
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - monitoring-net
      - clinika-default
    depends_on:
      - prometheus

  # ── Redis exporter ───────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    profiles: ["metrics"]
    environment:
      REDIS_ADDR: "redis://clinika-redis:6379"
    healthcheck:
      test: ["CMD", "/redis_exporter", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - monitoring-net
      - clinika-default
    depends_on:
      - prometheus

  # ── Grafana: дашборды ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    profiles: ["metrics"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Fail-fast: без GRAFANA_ADMIN_PASSWORD в .env сервис НЕ стартует
      # (раньше тихо дефолтился на admin/admin — небезопасно).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_SERVER_ROOT_URL: "https://клиниксеть.рф/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
    mem_limit: 512m
    cpus: 0.5
    networks:
      - monitoring-net
      - clinika-default
    depends_on:
      - prometheus

  # ── Node exporter (метрики хоста через /proc и /sys mounts) ──────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    profiles: ["metrics"]
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - monitoring-net

  # ── cAdvisor (метрики Docker-контейнеров) ────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    profiles: ["metrics"]
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
    networks:
      - monitoring-net

  # ── Blackbox exporter (HTTP/TCP пробы) ───────────────────────────────────
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    profiles: ["metrics"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    networks:
      - monitoring-net

volumes:
  prometheus-data:
  grafana-data:
  uptime-kuma:

networks:
  monitoring-net:
    driver: bridge
  clinika-default:
    external: true
    name: clinika_clinika-net
