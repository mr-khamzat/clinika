# Единая ротация логов для всех сервисов (max ~100MB на контейнер)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  clinika-db:
    image: postgres:16-alpine
    container_name: clinika-db
    restart: always
    # pg_stat_statements: shared_preload_libraries требует рестарт PG.
    # track=all — включая запросы внутри функций/триггеров.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
    environment:
      POSTGRES_DB: clinika
      POSTGRES_USER: clinika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - clinika-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinika"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - clinika-net

  clinika-redis:
    image: redis:7-alpine
    container_name: clinika-redis
    restart: always
    volumes:
      - clinika-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - clinika-net

  # Sidecar: read-only доступ к Docker API без монтирования socket в backend
  clinika-docker-proxy:
    build: ./docker-proxy
    container_name: clinika-docker-proxy
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging
    networks:
      - clinika-net
    # Не пробрасываем порт наружу — только внутри clinika-net

  clinika-backend:
    build: ./backend
    container_name: clinika-backend
    restart: always
    env_file: .env
    volumes:
      - ./VERSION:/app/VERSION:ro
      - /opt/clinika/uploads:/app/uploads
      - /opt/clinika/data:/app/data
      # docker.sock убран — используем clinika-docker-proxy
    ports:
      - "127.0.0.1:8900:8000"
    depends_on:
      clinika-db:
        condition: service_healthy
      clinika-redis:
        condition: service_started
      clinika-docker-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    networks:
      - clinika-net

  clinika-frontend:
    build:
      context: ./frontend
      # Sentry DSN передаётся как build-arg, чтобы Vite запёк его в бандл.
      # Если переменная пустая — Sentry просто не инициализируется в браузере.
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
    container_name: clinika-frontend
    restart: always
    volumes:
      # Installer-пакеты Electron-приложения KliniknetCalls — лежат на хосте,
      # не запекаем в image (1.7GB economy). Раздаются nginx по /downloads/.
      - /opt/clinika/downloads:/usr/share/nginx/html/downloads:ro
    ports:
      - "127.0.0.1:8901:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null 2>&1 || curl -fsS http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    networks:
      - clinika-net

  clinika-bot:
    build: ./bot
    container_name: clinika-bot
    restart: always
    env_file: .env
    depends_on:
      - clinika-backend
    # Бот запущен как PID 1 (python bot.py). pgrep отсутствует в slim-образе,
    # поэтому проверяем что PID 1 — python через /proc.
    healthcheck:
      test: ["CMD-SHELL", "grep -q '^python' /proc/1/comm || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks:
      - clinika-net

volumes:
  clinika-db-data:
  clinika-redis-data:

networks:
  clinika-net:
    driver: bridge
