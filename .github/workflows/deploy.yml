name: CI/CD Clinika

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        run: ruff check backend/app/ --ignore E501,F401
        continue-on-error: true  # не блокируем деплой из-за стиля

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /opt/clinika
            git pull origin main

            # Backend: пересобрать только если изменился backend/
            if git diff HEAD~1 --name-only | grep -q '^backend/'; then
              docker compose build --no-cache clinika-backend
              docker compose up -d clinika-backend
              echo "Backend redeployed"
            fi

            # Frontend: пересобрать только если изменился frontend/
            if git diff HEAD~1 --name-only | grep -q '^frontend/'; then
              docker compose build --no-cache clinika-frontend
              docker compose up -d clinika-frontend
              echo "Frontend redeployed"
            fi

            # Bot: пересобрать только если изменился bot/
            if git diff HEAD~1 --name-only | grep -q '^bot/'; then
              docker compose build --no-cache clinika-bot
              docker compose up -d clinika-bot
              echo "Bot redeployed"
            fi

            # Docker proxy: пересобрать только если изменился docker-proxy/
            if git diff HEAD~1 --name-only | grep -q '^docker-proxy/'; then
              docker compose build --no-cache clinika-docker-proxy
              docker compose up -d clinika-docker-proxy
              echo "Docker proxy redeployed"
            fi

            # Всегда проверяем состояние контейнеров
            sleep 5
            docker compose ps
