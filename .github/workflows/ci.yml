name: CI Clinika

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: ruff lint backend ──────────────────────────────────────────────
  lint-backend:
    name: Lint Backend (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.7.4

      - name: Ruff check
        run: ruff check backend/app/ --ignore E501,F401
        continue-on-error: true  # стиль не блокирует CI

  # ─── Job 2: vite build frontend ────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # ─── Job 3: pytest backend ─────────────────────────────────────────────────
  test-backend:
    name: Test Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-secret-key-for-pytest-32chars!!
      QR_SECRET: ci-qr-secret
      SUPERADMIN_USERNAME: ciadmin
      SUPERADMIN_PASSWORD: cipass
      SUPERADMIN_FULL_NAME: CI Admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest (unit)
        working-directory: backend
        run: pytest -v -m "not integration" --tb=short

      - name: Create test database (integration)
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d test -c "CREATE DATABASE clinika_test;" || true

      - name: Run pytest (integration)
        working-directory: backend
        env:
          CLINIKA_TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/clinika_test
        run: pytest -v -m integration --tb=short
