# Prometheus для КлиникСеть.
# Запуск: docker compose -f docker-compose.monitoring.yml --profile metrics up -d
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'clinika-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'clinika-backend'
    metrics_path: '/metrics'
    # Backend пускает только с client_ip=127.0.0.1. Подменяем X-Real-IP в header.
    # (Settings не объявил metrics_token → params:token не работает.)
    http_headers:
      X-Real-IP:
        values: ['127.0.0.1']
    static_configs:
      - targets: ['clinika-backend:8000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://xn--e1afagcdp8ak4h.xn--p1ai/
        - https://xn--e1afagcdp8ak4h.xn--p1ai/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
        - 212.57.118.126:3478
        - 212.57.118.126:5349
        - 212.57.118.126:443
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
