server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: все пути отдаём index.html (slug читается JS из URL)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика (assets) — долгий кеш
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
