server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip — сжимает JS/CSS/HTML на лету
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        application/x-font-ttf;

    # SPA: все пути отдаём index.html (slug читается JS из URL)
    location / {
        try_files $uri $uri/ /index.html;
        # index.html — не кешировать (чтобы новый деплой сразу подхватывался)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Статика (assets с hash в имени) — кешировать на 1 год
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
