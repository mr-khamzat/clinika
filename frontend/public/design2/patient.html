<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КлиникСеть · Кабинет пациента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Patient cabinet — premium dark theme */
:root {
  --hue: 215;

  /* Surfaces */
  --bg: oklch(0.16 0.012 var(--hue));
  --bg-1: oklch(0.19 0.014 var(--hue));
  --bg-2: oklch(0.22 0.016 var(--hue));
  --bg-3: oklch(0.26 0.018 var(--hue));
  --surface: oklch(0.21 0.014 var(--hue));
  --surface-hi: oklch(0.25 0.018 var(--hue));
  --border: oklch(0.30 0.014 var(--hue) / 0.6);
  --border-strong: oklch(0.36 0.018 var(--hue));
  --line: oklch(0.30 0.014 var(--hue) / 0.4);

  /* Text */
  --fg: oklch(0.97 0.005 var(--hue));
  --fg-2: oklch(0.78 0.012 var(--hue));
  --fg-3: oklch(0.62 0.014 var(--hue));
  --fg-4: oklch(0.48 0.014 var(--hue));

  /* Accent (teal-blue premium) */
  --accent: oklch(0.78 0.14 200);
  --accent-2: oklch(0.86 0.13 180);
  --accent-soft: oklch(0.78 0.14 200 / 0.14);
  --accent-line: oklch(0.78 0.14 200 / 0.32);
  --accent-fg: oklch(0.20 0.04 220);

  /* Semantic */
  --good: oklch(0.82 0.16 150);
  --good-soft: oklch(0.82 0.16 150 / 0.14);
  --warn: oklch(0.85 0.14 75);
  --warn-soft: oklch(0.85 0.14 75 / 0.14);
  --bad: oklch(0.74 0.16 25);
  --bad-soft: oklch(0.74 0.16 25 / 0.14);
  --gold: oklch(0.85 0.14 85);

  --radius: 14px;
  --radius-sm: 10px;
  --radius-lg: 22px;

  --shadow-sm: 0 1px 0 oklch(1 0 0 / 0.04) inset, 0 1px 2px oklch(0 0 0 / 0.4);
  --shadow-md: 0 1px 0 oklch(1 0 0 / 0.04) inset, 0 8px 24px oklch(0 0 0 / 0.45);
  --shadow-lg: 0 1px 0 oklch(1 0 0 / 0.05) inset, 0 24px 60px oklch(0 0 0 / 0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Golos Text', -apple-system, system-ui, sans-serif;
  background: var(--bg); color: var(--fg);
  -webkit-font-smoothing: antialiased;
  font-size: 14.5px; line-height: 1.5;
  min-height: 100vh;
}
button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }
input { outline: none; }

/* ============ APP SHELL ============ */
.app {
  display: grid;
  grid-template-columns: 240px 1fr 340px;
  min-height: 100vh;
  background:
    radial-gradient(ellipse 60% 40% at 80% 0%, oklch(0.78 0.14 200 / 0.06), transparent 60%),
    radial-gradient(ellipse 50% 40% at 0% 100%, oklch(0.86 0.13 180 / 0.04), transparent 60%),
    var(--bg);
}

/* ============ SIDEBAR ============ */
.side {
  border-right: 1px solid var(--border);
  padding: 22px 14px;
  display: flex; flex-direction: column;
  background: oklch(0.18 0.014 var(--hue) / 0.6);
  backdrop-filter: blur(20px);
}
.side-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 10px 22px;
}
.side-brand-mark {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  display: grid; place-items: center;
  color: var(--accent-fg); font-weight: 700; font-size: 14px;
  box-shadow: 0 0 0 1px oklch(1 0 0 / 0.06), 0 8px 20px oklch(0.78 0.14 200 / 0.25);
}
.side-brand-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.side-brand-name span { display: block; font-size: 11px; color: var(--fg-3); font-weight: 500; }

.side-section {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em;
  color: var(--fg-4); text-transform: uppercase;
  padding: 14px 10px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 8px 10px; border-radius: 9px;
  font-size: 13.5px; color: var(--fg-2); font-weight: 500;
  cursor: pointer; user-select: none;
  margin-bottom: 1px;
  position: relative;
  transition: background .12s, color .12s;
}
.nav-item:hover { background: oklch(1 0 0 / 0.04); color: var(--fg); }
.nav-item[data-active="true"] {
  background: var(--accent-soft);
  color: var(--accent);
}
.nav-item[data-active="true"]::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px;
  background: var(--accent); border-radius: 2px;
}
.nav-item-icon {
  width: 18px; height: 18px; flex-shrink: 0;
  display: grid; place-items: center;
  font-size: 14px;
}
.nav-item-badge {
  margin-left: auto;
  background: var(--accent); color: var(--accent-fg);
  font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px;
  min-width: 18px; text-align: center;
}
.nav-item-badge.warn { background: var(--warn); color: oklch(0.2 0.04 80); }

.side-foot {
  margin-top: auto;
  padding: 14px 10px;
  border-top: 1px solid var(--border);
}

/* ============ MAIN ============ */
.main {
  min-width: 0;
  display: flex; flex-direction: column;
}
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 28px;
  border-bottom: 1px solid var(--border);
  background: oklch(0.18 0.014 var(--hue) / 0.7);
  backdrop-filter: blur(20px);
  position: sticky; top: 0; z-index: 10;
}
.topbar-search {
  flex: 1; max-width: 520px;
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 9px 14px;
  color: var(--fg-3);
  font-size: 13px;
}
.topbar-search input {
  flex: 1; border: 0; background: transparent;
  font-size: 13.5px; color: var(--fg);
}
.topbar-search input::placeholder { color: var(--fg-4); }
.topbar-kbd {
  padding: 2px 6px; border-radius: 5px; font-size: 10.5px;
  background: var(--bg-3); color: var(--fg-3);
  border: 1px solid var(--border);
  font-family: 'SF Mono', Consolas, monospace;
}
.topbar-icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  display: grid; place-items: center;
  color: var(--fg-2); font-size: 16px;
  position: relative;
}
.topbar-icon-btn:hover { background: var(--bg-3); color: var(--fg); }
.topbar-icon-btn .pip {
  position: absolute; top: 8px; right: 8px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--bad);
  box-shadow: 0 0 0 2px var(--bg-2);
}
.topbar-avatar {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 10px 5px 5px; border-radius: 999px;
  background: var(--bg-2); border: 1px solid var(--border);
  cursor: pointer;
}
.topbar-avatar:hover { background: var(--bg-3); }
.topbar-avatar-img {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, oklch(0.7 0.14 30), oklch(0.65 0.16 60));
  display: grid; place-items: center;
  color: #fff; font-size: 11px; font-weight: 700;
}
.topbar-avatar-name { font-size: 13px; font-weight: 500; }

.content {
  flex: 1; padding: 28px;
  overflow-x: hidden;
}
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; margin-bottom: 28px;
}
.page-title {
  font-size: 28px; font-weight: 600;
  letter-spacing: -0.025em; line-height: 1.1;
}
.page-sub {
  font-size: 14px; color: var(--fg-3); margin-top: 6px;
}

/* ============ CARDS ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.card-hd {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.card-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.card-sub { font-size: 12.5px; color: var(--fg-3); margin-top: 2px; }

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 10px;
  font-size: 13.5px; font-weight: 600;
  transition: background .12s, transform .08s;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--accent); color: var(--accent-fg);
  box-shadow: 0 1px 0 oklch(1 0 0 / 0.12) inset, 0 6px 16px oklch(0.78 0.14 200 / 0.25);
}
.btn-primary:hover { background: oklch(0.83 0.13 200); }
.btn-secondary {
  background: var(--bg-2); color: var(--fg);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--bg-3); }
.btn-ghost { color: var(--fg-2); }
.btn-ghost:hover { background: oklch(1 0 0 / 0.04); color: var(--fg); }
.btn-sm { padding: 6px 12px; font-size: 12.5px; border-radius: 8px; }
.btn-lg { padding: 13px 22px; font-size: 14.5px; border-radius: 11px; }

/* ============ CHIPS / PILLS ============ */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 11.5px; font-weight: 500;
  background: var(--bg-2); color: var(--fg-2);
  border: 1px solid var(--border);
}
.chip-good { background: var(--good-soft); color: var(--good); border-color: var(--good-soft); }
.chip-warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-soft); }
.chip-bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-soft); }
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.chip-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ============ DASHBOARD ============ */
.greeting {
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px;
  padding: 24px 28px;
  margin-bottom: 24px;
  border-radius: var(--radius-lg);
  background:
    radial-gradient(ellipse 60% 100% at 100% 50%, oklch(0.78 0.14 200 / 0.18), transparent 70%),
    linear-gradient(135deg, var(--bg-1), var(--bg-2));
  border: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.greeting h2 {
  font-size: 26px; font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.15;
  margin-bottom: 6px;
}
.greeting p { color: var(--fg-3); font-size: 14px; max-width: 520px; }
.greeting-actions { display: flex; gap: 10px; flex-shrink: 0; }

.dash-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.kpi-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; margin-bottom: 16px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.kpi-label { font-size: 11.5px; color: var(--fg-3); font-weight: 500; }
.kpi-value {
  font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}
.kpi-delta { font-size: 11px; color: var(--good); margin-top: 2px; font-weight: 500; }
.kpi-delta.bad { color: var(--bad); }

/* Appointment card */
.appt-card {
  position: relative;
  background:
    radial-gradient(ellipse 50% 70% at 100% 0%, oklch(0.78 0.14 200 / 0.12), transparent 60%),
    var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex; gap: 18px;
}
.appt-date {
  width: 64px; flex-shrink: 0;
  text-align: center;
  padding: 12px 0;
  border-radius: 11px;
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
}
.appt-date-day { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: var(--accent); }
.appt-date-mon { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-top: -2px; }
.appt-date-time { font-size: 11.5px; color: var(--fg-2); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--accent-line); font-weight: 500; }
.appt-info { flex: 1; min-width: 0; }
.appt-info h4 { font-size: 16px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.01em; }
.appt-meta { color: var(--fg-3); font-size: 12.5px; margin-bottom: 4px; }
.appt-doc {
  display: flex; align-items: center; gap: 8px;
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 12px;
}
.appt-doc-avatar {
  width: 24px; height: 24px; border-radius: 50%;
  background: linear-gradient(135deg, oklch(0.55 0.14 280), oklch(0.6 0.14 230));
  display: grid; place-items: center;
  font-size: 9.5px; font-weight: 700; color: #fff;
}
.appt-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

/* Quick actions */
.quick-actions {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
}
.qa {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 14px;
  text-align: left;
  display: flex; flex-direction: column; gap: 10px;
  transition: all .15s;
}
.qa:hover { background: var(--surface-hi); border-color: var(--border-strong); transform: translateY(-1px); }
.qa-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
  font-size: 16px;
}
.qa-label { font-size: 13px; font-weight: 600; }
.qa-sub { font-size: 11.5px; color: var(--fg-3); }

/* Health snapshot */
.vitals { display: grid; gap: 10px; }
.vital-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.vital-row:last-child { border-bottom: 0; }
.vital-icon {
  width: 32px; height: 32px; border-radius: 9px;
  background: var(--bg-2);
  display: grid; place-items: center;
  font-size: 14px;
}
.vital-label { flex: 1; font-size: 13px; }
.vital-label small { display: block; font-size: 11px; color: var(--fg-3); }
.vital-value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Loyalty card */
.loyalty {
  position: relative;
  border-radius: var(--radius);
  padding: 18px;
  background:
    radial-gradient(ellipse 80% 100% at 0% 0%, oklch(0.85 0.14 85 / 0.18), transparent 65%),
    linear-gradient(135deg, oklch(0.22 0.03 85), oklch(0.18 0.014 215));
  border: 1px solid var(--border);
  overflow: hidden;
}
.loyalty::after {
  content: ''; position: absolute; top: -40px; right: -40px;
  width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, oklch(0.85 0.14 85 / 0.18), transparent 70%);
  pointer-events: none;
}
.loyalty-tier {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px;
  background: oklch(0.85 0.14 85 / 0.14);
  color: var(--gold);
  border: 1px solid oklch(0.85 0.14 85 / 0.3);
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  margin-bottom: 10px;
}
.loyalty-balance { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.loyalty-balance small { font-size: 14px; color: var(--fg-3); font-weight: 500; margin-left: 4px; }
.loyalty-prog {
  margin-top: 14px;
  background: oklch(1 0 0 / 0.06);
  height: 6px; border-radius: 999px; overflow: hidden;
}
.loyalty-prog-fill { height: 100%; background: linear-gradient(90deg, var(--gold), oklch(0.92 0.12 65)); border-radius: 999px; }
.loyalty-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--fg-3); margin-top: 8px; }

/* List items */
.list-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-top: 1px solid var(--line);
}
.list-row:first-child { border-top: 0; padding-top: 0; }
.list-row:last-child { padding-bottom: 0; }

/* ============ AI BOT ============ */
.bot-fab {
  position: fixed; bottom: 22px; right: 22px;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--accent-fg);
  display: grid; place-items: center;
  box-shadow: 0 8px 32px oklch(0.78 0.14 200 / 0.4), 0 0 0 4px oklch(0.78 0.14 200 / 0.12);
  z-index: 50;
  font-size: 22px;
}
.bot-fab::after {
  content: ''; position: absolute; inset: -4px; border-radius: 50%;
  background: var(--accent); opacity: 0.2; animation: ring 2.4s ease-out infinite;
}
@keyframes ring { 0% { transform: scale(1); opacity: 0.3; } 100% { transform: scale(1.6); opacity: 0; } }
.bot-panel {
  position: fixed; bottom: 22px; right: 22px;
  width: 360px; max-height: 560px;
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  z-index: 60;
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: bot-in .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes bot-in { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: none; } }
.bot-hd {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.bot-hd-avatar {
  width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center; color: var(--accent-fg);
  font-weight: 700; font-size: 12px;
}
.bot-hd-info { flex: 1; }
.bot-hd-info-name { font-size: 13.5px; font-weight: 600; }
.bot-hd-info-status { font-size: 11px; color: var(--good); display: flex; align-items: center; gap: 5px; }
.bot-hd-info-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.bot-x {
  width: 28px; height: 28px; border-radius: 7px;
  display: grid; place-items: center; color: var(--fg-3);
}
.bot-x:hover { background: var(--bg-2); color: var(--fg); }
.bot-msgs {
  flex: 1; overflow-y: auto;
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.bot-msg {
  max-width: 84%;
  padding: 10px 13px;
  border-radius: 14px;
  font-size: 13px; line-height: 1.45;
}
.bot-msg-bot {
  align-self: flex-start;
  background: var(--bg-2); color: var(--fg);
  border-bottom-left-radius: 4px;
}
.bot-msg-me {
  align-self: flex-end;
  background: var(--accent); color: var(--accent-fg);
  border-bottom-right-radius: 4px;
}
.bot-suggest {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 4px 16px 0;
}
.bot-suggest button {
  padding: 6px 11px; font-size: 12px; font-weight: 500;
  background: var(--bg-2); color: var(--fg-2);
  border: 1px solid var(--border); border-radius: 999px;
}
.bot-suggest button:hover { background: var(--bg-3); color: var(--fg); }
.bot-input {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.bot-input input {
  flex: 1; background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 9px 12px;
  font-size: 13px;
}
.bot-input input:focus { border-color: var(--accent-line); }
.bot-send {
  width: 34px; height: 34px; border-radius: 9px;
  background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center;
  font-size: 14px;
}

/* ============ NOTIFICATIONS DRAWER ============ */
.notify-rail {
  border-left: 1px solid var(--border);
  background: oklch(0.18 0.014 var(--hue) / 0.7);
  padding: 22px 22px 110px;
  display: flex; flex-direction: column; gap: 16px;
  overflow-y: auto;
  max-height: 100vh;
  position: sticky; top: 0;
}
.notify-hd {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px;
}
.notify-hd h3 { font-size: 15px; font-weight: 600; }
.notif {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex; gap: 11px;

// Inline tweaks helpers (replaces external tweaks-panel.jsx)
const { useState: __useState1 } = React;

function useTweaks(defaults) {
  const [v, setV] = __useState1(defaults);
  const set = (k, val) => {
    if (typeof k === 'object') {
      setV(prev => ({ ...prev, ...k }));
      try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: k }, '*'); } catch(e){}
    } else {
      setV(prev => ({ ...prev, [k]: val }));
      try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: val } }, '*'); } catch(e){}
    }
  };
  return [v, set];
}

function TweaksPanel({ children }) {
  const [open, setOpen] = __useState1(false);
  const [available, setAvailable] = __useState1(false);
  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') { setOpen(true); setAvailable(true); }
      if (e.data.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(e){}
    return () => window.removeEventListener('message', onMsg);
  }, []);
  if (!open) {
    return <button className="tw-fab" onClick={() => setOpen(true)}>⚙ Tweaks</button>;
  }
  return (
    <div className="tw-panel">
      <div className="tw-hd">
        <div className="tw-hd-title">Tweaks</div>
        <button className="tw-x" onClick={() => { setOpen(false); try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch(e){} }}>×</button>
      </div>
      {children}
    </div>
  );
}

function TweakSection({ label }) { return <div className="tw-section">{label}</div>; }

function TweakRadio({ label, value, options, onChange }) {
  return (
    <div style={{ marginBottom: 8 }}>
      {label && <div style={{ fontSize: 12, color: 'var(--fg-2)', marginBottom: 6 }}>{label}</div>}
      <div className="tw-radio" style={{ gridTemplateColumns: `repeat(${options.length}, 1fr)` }}>
        {options.map(o => (
          <button key={o} data-on={value === o} onClick={() => onChange(o)}>{o}</button>
        ))}
      </div>
    </div>
  );
}

function TweakButton({ label, onClick }) {
  return <button className="tw-btn" onClick={onClick}>{label}</button>;
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakButton });
</script>

// Simple SVG QR placeholder generator
function QRCode({ size = 160, seed = 'anna-104857' }) {
  // pseudo-deterministic 21x21 grid
  const N = 21, cell = size / N;
  const cells = [];
  let s = 0;
  for (let i = 0; i < seed.length; i++) s = (s * 31 + seed.charCodeAt(i)) >>> 0;
  const rand = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      // finder patterns
      const finder = (x < 7 && y < 7) || (x >= N-7 && y < 7) || (x < 7 && y >= N-7);
      let on = false;
      if (finder) {
        const fx = x < 7 ? x : (x - (N-7));
        const fy = y < 7 ? y : (y - (N-7));
        on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4);
      } else {
        on = rand() > 0.5;
      }
      if (on) cells.push(<rect key={`${x}-${y}`} x={x*cell} y={y*cell} width={cell} height={cell} fill="#0d1117" />);
    }
  }
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ background: '#fff', borderRadius: 10, padding: 8, boxSizing: 'content-box' }}>
      {cells}
    </svg>
  );
}

// Sparkline svg
function Sparkline({ vals, width = 110, height = 28, color = 'currentColor' }) {
  const max = Math.max(...vals), min = Math.min(...vals);
  const span = max - min || 1;
  const dx = width / (vals.length - 1);
  const pts = vals.map((v, i) => `${i*dx},${height - ((v - min) / span) * height}`).join(' ');
  const last = vals[vals.length-1], lastY = height - ((last - min) / span) * height;
  return (
    <svg width={width} height={height} className="spark-svg">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={width} cy={lastY} r="2.5" fill={color} />
    </svg>
  );
}

            <div style={{ fontSize: 11.5, color: 'var(--fg-3)' }}>{s}</div>
          </div>
          <div style={{ color: 'var(--fg-3)' }}>›</div>
        </div>
      ))}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
