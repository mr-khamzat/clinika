/* КлиникСеть · общая дизайн-система · светлая тема для рабочих кабинетов */
:root {
  --hue: 220;
  --bg: oklch(0.985 0.004 var(--hue));
  --bg-1: oklch(0.97 0.005 var(--hue));
  --bg-2: oklch(0.955 0.006 var(--hue));
  --bg-3: oklch(0.93 0.008 var(--hue));
  --surface: oklch(1 0 0);
  --surface-hi: oklch(0.98 0.004 var(--hue));
  --border: oklch(0.90 0.008 var(--hue));
  --border-strong: oklch(0.84 0.01 var(--hue));
  --line: oklch(0.93 0.008 var(--hue));
  --fg: oklch(0.18 0.014 var(--hue));
  --fg-2: oklch(0.36 0.012 var(--hue));
  --fg-3: oklch(0.52 0.012 var(--hue));
  --fg-4: oklch(0.65 0.012 var(--hue));
  --accent: oklch(0.55 0.16 240);
  --accent-2: oklch(0.62 0.15 220);
  --accent-soft: oklch(0.55 0.16 240 / 0.10);
  --accent-line: oklch(0.55 0.16 240 / 0.28);
  --accent-fg: #fff;
  --good: oklch(0.55 0.15 150);
  --good-soft: oklch(0.55 0.15 150 / 0.10);
  --warn: oklch(0.65 0.15 65);
  --warn-soft: oklch(0.65 0.15 65 / 0.12);
  --bad: oklch(0.55 0.20 25);
  --bad-soft: oklch(0.55 0.20 25 / 0.10);
  --gold: oklch(0.62 0.13 75);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 18px;
  --shadow-sm: 0 1px 2px oklch(0.18 0.014 220 / 0.06);
  --shadow-md: 0 4px 14px oklch(0.18 0.014 220 / 0.08);
  --shadow-lg: 0 20px 50px oklch(0.18 0.014 220 / 0.12);
  --density-pad: 14px;
  --density-row: 12px;
}
[data-density="compact"] { --density-pad: 10px; --density-row: 8px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: 'Golos Text', -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; font-size: 14px; line-height: 1.5; min-height: 100vh; }
button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }
input, select, textarea { outline: none; }
.app { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
.side { border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; background: var(--bg-1); position: sticky; top: 0; max-height: 100vh; overflow-y: auto; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.side-brand-mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(140deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; box-shadow: 0 4px 12px oklch(0.55 0.16 240 / 0.25); }
.side-brand-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.side-brand-name span { display: block; font-size: 11px; color: var(--fg-3); font-weight: 500; }
.side-section { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--fg-4); text-transform: uppercase; padding: 12px 10px 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: var(--fg-2); font-weight: 500; cursor: pointer; user-select: none; margin-bottom: 1px; position: relative; }
.nav-item:hover { background: var(--bg-2); color: var(--fg); }
.nav-item[data-active="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item-ico { width: 18px; text-align: center; font-size: 14px; }
.nav-item-badge { margin-left: auto; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; min-width: 18px; text-align: center; }
.nav-item-badge.warn { background: var(--warn); }
.nav-item-badge.bad { background: var(--bad); }
.side-foot { margin-top: auto; padding: 12px 6px; border-top: 1px solid var(--border); }
.side-user { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 9px; }
.side-user:hover { background: var(--bg-2); }
.side-user-name { font-size: 12.5px; font-weight: 600; }
.side-user-role { font-size: 11px; color: var(--fg-3); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--border); background: oklch(1 0 0 / 0.85); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 10; }
.topbar-search { flex: 1; max-width: 480px; display: flex; align-items: center; gap: 8px; background: var(--bg-1); border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; color: var(--fg-3); font-size: 13px; }
.topbar-search input { flex: 1; border: 0; background: transparent; font-size: 13px; color: var(--fg); }
.topbar-search input::placeholder { color: var(--fg-4); }
.topbar-kbd { padding: 1px 5px; border-radius: 4px; font-size: 10.5px; background: var(--bg-2); color: var(--fg-3); border: 1px solid var(--border); font-family: 'SF Mono', Consolas, monospace; }
.topbar-icon-btn { width: 34px; height: 34px; border-radius: 9px; background: var(--bg-1); border: 1px solid var(--border); display: grid; place-items: center; color: var(--fg-2); font-size: 14px; position: relative; }
.topbar-icon-btn:hover { background: var(--bg-2); color: var(--fg); }

.content { flex: 1; padding: 22px 24px 80px; overflow-x: hidden; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.page-title { font-size: 24px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.15; }
.page-sub { font-size: 13px; color: var(--fg-3); margin-top: 4px; }

.card-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.card-sub { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; white-space: nowrap; transition: background .12s; }
.btn-primary { background: var(--accent); color: var(--accent-fg); box-shadow: 0 1px 0 oklch(1 0 0 / 0.2) inset, 0 4px 12px oklch(0.55 0.16 240 / 0.22); }

.btn-secondary { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-2); border-color: var(--border-strong); }
.btn-ghost { color: var(--fg-2); }
.btn-ghost:hover { background: var(--bg-2); color: var(--fg); }
.btn-danger { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-soft); }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
.btn-lg { padding: 12px 20px; font-size: 14px; border-radius: 10px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; background: var(--bg-2); color: var(--fg-2); border: 1px solid var(--border); }
.chip-good { background: var(--good-soft); color: var(--good); border-color: var(--good-soft); }
.chip-warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-soft); }
.chip-bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-soft); }
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.chip-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.kpi-label { font-size: 11.5px; color: var(--fg-3); font-weight: 500; }
.kpi-value { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi-delta { font-size: 11.5px; color: var(--good); margin-top: 2px; font-weight: 500; }
.kpi-delta.bad { color: var(--bad); }
.kpi-delta.muted { color: var(--fg-3); }
.tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
.tab { padding: 10px 14px; font-size: 13px; font-weight: 500; color: var(--fg-3); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tab[data-active="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tab:hover { color: var(--fg); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; padding: 10px 12px; font-weight: 600; font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); background: var(--bg-1); position: sticky; top: 0; }
.tbl td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:hover td { background: var(--bg-1); }

.avatar { border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; flex-shrink: 0; }

.avatar.md { width: 36px; height: 36px; font-size: 12px; }
.avatar.lg { width: 48px; height: 48px; font-size: 15px; }
.avatar.xl { width: 72px; height: 72px; font-size: 22px; border-radius: 16px; }

.av-3 { background: linear-gradient(135deg, oklch(0.55 0.14 200), oklch(0.6 0.14 160)); }
.av-4 { background: linear-gradient(135deg, oklch(0.55 0.14 120), oklch(0.6 0.14 80)); }
.av-5 { background: linear-gradient(135deg, oklch(0.55 0.16 50), oklch(0.6 0.14 20)); }
.av-6 { background: linear-gradient(135deg, oklch(0.5 0.16 320), oklch(0.55 0.16 280)); }

window.makeTweaks = function(React) {
  const { useState, useEffect } = React;
  function useTweaks(defaults) {
    const [v, setV] = useState(defaults);
    const set = (k, val) => {
      const patch = (typeof k === 'object') ? k : { [k]: val };
      setV(prev => ({ ...prev, ...patch }));
      try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*'); } catch(e){}
    };
    return [v, set];
  }
  function TweaksPanel({ children }) {
    const [open, setOpen] = useState(false);
    useEffect(() => {
      const onMsg = (e) => {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === '__activate_edit_mode') setOpen(true);
        if (e.data.type === '__deactivate_edit_mode') setOpen(false);
      };
      window.addEventListener('message', onMsg);
      try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(e){}
      return () => window.removeEventListener('message', onMsg);
    }, []);
    if (!open) return React.createElement('button', { className: 'tw-fab', onClick: () => setOpen(true) }, '⚙ Tweaks');
    return React.createElement('div', { className: 'tw-panel' },
      React.createElement('div', { className: 'tw-hd' },
        React.createElement('div', { className: 'tw-hd-title' }, 'Tweaks'),
        React.createElement('button', { className: 'tw-x', onClick: () => { setOpen(false); try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch(e){} } }, '×'),
      ),
      children
    );
  }
  function TweakSection({ label }) { return React.createElement('div', { className: 'tw-section' }, label); }
  function TweakRadio({ label, value, options, onChange }) {
    return React.createElement('div', { style: { marginBottom: 8 } },
      label && React.createElement('div', { className: 'tw-label' }, label),
      React.createElement('div', { className: 'tw-radio', style: { gridTemplateColumns: `repeat(${options.length}, 1fr)` } },
        options.map(o => React.createElement('button', { key: o, 'data-on': value === o, onClick: () => onChange(o) }, o))
      )
    );
  }
  return { useTweaks, TweaksPanel, TweakSection, TweakRadio };
};

window.applyTheme = function(name) {
  const p = window.themePalettes[name] || window.themePalettes.blue;
  const r = document.documentElement.style;
  r.setProperty('--accent', p.c1);
  r.setProperty('--accent-2', p.c2);

  r.setProperty('--accent-soft', pull(p.c1, 0.10));
  r.setProperty('--accent-line', pull(p.c1, 0.28));
};
