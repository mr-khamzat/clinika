<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КлиникСеть — SaaS для медицинских сетей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* КлиникСеть — clean platform landing */

:root {
  --accent: oklch(0.55 0.16 240);
  --accent-strong: oklch(0.46 0.18 240);
  --accent-soft: oklch(0.96 0.04 240);
  --accent-line: oklch(0.88 0.07 240);

  --fg: oklch(0.18 0.02 255);
  --fg2: oklch(0.42 0.02 255);
  --fg3: oklch(0.58 0.015 255);
  --bg: oklch(1 0 0);
  --bg2: oklch(0.985 0.005 250);
  --bg3: oklch(0.965 0.008 250);
  --border: oklch(0.92 0.008 255);
  --border-strong: oklch(0.86 0.012 255);
  --card: oklch(1 0 0);
  --shadow-sm: 0 1px 2px oklch(0.20 0.02 255 / 0.04), 0 1px 1px oklch(0.20 0.02 255 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.20 0.02 255 / 0.06), 0 2px 4px oklch(0.20 0.02 255 / 0.04);
  --shadow-lg: 0 24px 60px oklch(0.20 0.04 255 / 0.10), 0 8px 24px oklch(0.20 0.04 255 / 0.06);

  --radius: 14px;
  --radius-sm: 10px;
  --radius-lg: 22px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Golos Text', -apple-system, system-ui, sans-serif;
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body { font-size: 16px; line-height: 1.55; }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

.nav {
  position: sticky; top: 0; z-index: 100;
  background: oklch(1 0 0 / 0.78);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 1240px; margin: 0 auto;
  display: flex; align-items: center; gap: 32px;
  padding: 14px 28px;
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 18px; font-weight: 600; letter-spacing: -0.02em;
}
.nav-logo-mark {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(140deg, var(--accent), oklch(0.55 0.16 200));
  display: grid; place-items: center;
  color: #fff; font-weight: 700; font-size: 14px;
  box-shadow: 0 4px 10px oklch(0.55 0.16 240 / 0.3);
}
.nav-links { display: flex; gap: 4px; margin-left: auto; }
.nav-link {
  padding: 7px 14px; border-radius: 8px;
  font-size: 14px; font-weight: 500; color: var(--fg2);
  transition: all 0.15s;
}
.nav-link:hover { color: var(--fg); background: var(--bg3); }
.nav-cta {
  padding: 9px 18px; border-radius: 10px;
  background: var(--fg); color: #fff;
  font-size: 14px; font-weight: 600;
  transition: all 0.15s;
}
.nav-cta:hover { background: var(--accent-strong); }

.hero {
  position: relative;
  padding: 88px 28px 64px;
  overflow: hidden;
  background:
    radial-gradient(ellipse 70% 60% at 80% -10%, oklch(0.94 0.06 240 / 0.7), transparent 60%),
    radial-gradient(ellipse 50% 50% at 10% 30%, oklch(0.96 0.05 200 / 0.5), transparent 60%);
}
.hero-inner {
  max-width: 1240px; margin: 0 auto;
  display: grid; grid-template-columns: 1.05fr 0.95fr;
  gap: 64px; align-items: center;
}

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-strong);
  font-size: 13px; font-weight: 500;
  border: 1px solid var(--accent-line);
}
.eyebrow-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: oklch(0.7 0.18 145);
  box-shadow: 0 0 0 3px oklch(0.7 0.18 145 / 0.25);
}

.hero h1 {
  margin: 22px 0 22px;
  font-size: clamp(40px, 5.2vw, 64px);
  line-height: 1.04;
  letter-spacing: -0.035em;
  font-weight: 600;
  text-wrap: balance;
}
.hero h1 em {
  font-style: normal;
  background: linear-gradient(120deg, var(--accent) 0%, oklch(0.55 0.16 200) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-sub {
  font-size: 19px; line-height: 1.55; color: var(--fg2);
  max-width: 540px; margin-bottom: 32px;
  text-wrap: pretty;
}
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 36px; }

.btn-primary {
  padding: 13px 22px; border-radius: 11px;
  background: var(--fg); color: #fff;
  font-size: 15px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px;
  transition: all 0.15s;
  box-shadow: var(--shadow-md);
}
.btn-primary:hover { background: var(--accent-strong); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.btn-secondary {
  padding: 13px 22px; border-radius: 11px;
  background: oklch(1 0 0 / 0.6); color: var(--fg);
  font-size: 15px; font-weight: 600;
  border: 1px solid var(--border-strong);
  transition: all 0.15s;
}
.btn-secondary:hover { background: var(--bg); border-color: var(--fg2); }

.hero-trust {
  display: flex; align-items: center; gap: 18px;
  font-size: 13px; color: var(--fg3);
}
.hero-trust-stars { color: oklch(0.75 0.15 80); letter-spacing: 1px; }

.hero-side { position: relative; display: grid; gap: 16px; }
.persona-card {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--card);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  aspect-ratio: 4/5;
}
.persona-card img {
  width: 100%; height: 100%; object-fit: cover; object-position: 55% 35%;
  display: block;
}
.persona-card-tag {
  position: absolute; top: 16px; left: 16px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 999px;
  background: oklch(0.18 0.02 255 / 0.78);
  backdrop-filter: blur(10px);
  color: #fff; font-size: 12px; font-weight: 600;
}
.persona-card-tag .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: oklch(0.78 0.18 145);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
.persona-card-name {
  position: absolute; bottom: 18px; left: 18px; right: 18px;
  background: oklch(1 0 0 / 0.92);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex; align-items: center; gap: 12px;
}
.persona-card-name-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), oklch(0.55 0.16 200));
  display: grid; place-items: center;
  color: #fff; font-size: 11px; font-weight: 700;
  flex-shrink: 0;
}
.persona-card-name-info { flex: 1; min-width: 0; }
.persona-card-name-line { font-size: 14px; font-weight: 600; color: var(--fg); }
.persona-card-name-role { font-size: 12px; color: var(--fg2); margin-top: 1px; }

.persona-quote-card {
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 16px 18px;
  font-size: 14px; line-height: 1.55; color: var(--fg2);
}
.persona-quote-card strong { color: var(--fg); font-weight: 600; }

.stats-strip {
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 28px;
  background: var(--bg2);
}
.stats-strip-inner {
  max-width: 1240px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px;
}
.stat-num { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; color: var(--fg); }
.stat-label { font-size: 13px; color: var(--fg3); margin-top: 4px; }

section { padding: 96px 28px; }
.section-inner { max-width: 1240px; margin: 0 auto; }
.section-head { max-width: 720px; margin-bottom: 56px; }
.section-eyebrow {
  font-size: 13px; font-weight: 600; color: var(--accent-strong);
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 14px;
}
.section-title {
  font-size: clamp(32px, 4vw, 48px);
  line-height: 1.1;
  letter-spacing: -0.025em;
  font-weight: 600;
  text-wrap: balance;
}
.section-sub {
  font-size: 18px; color: var(--fg2);
  margin-top: 14px; line-height: 1.55;
  text-wrap: pretty;
}

.roles-section { background: var(--bg2); }
.roles-tabs {
  display: inline-flex; gap: 4px; padding: 5px;
  background: var(--bg); border-radius: 14px;
  border: 1px solid var(--border);
  margin-bottom: 28px;
  box-shadow: var(--shadow-sm);
}
.roles-tab {
  padding: 9px 18px; border-radius: 10px;
  font-size: 14px; font-weight: 500; color: var(--fg2);
  transition: all 0.15s;
  display: flex; align-items: center; gap: 8px;
}
.roles-tab:hover { color: var(--fg); }
.roles-tab[data-active="true"] { background: var(--fg); color: #fff; }
.roles-tab-dot { width: 6px; height: 6px; border-radius: 50%; }

.role-stage { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; align-items: center; }
.role-stage-text h3 {
  font-size: 32px; font-weight: 600;
  letter-spacing: -0.02em; line-height: 1.15;
  margin-bottom: 14px;
  text-wrap: balance;
}
.role-stage-text p {
  font-size: 17px; color: var(--fg2);
  line-height: 1.55; margin-bottom: 24px;
}
.role-features { display: grid; gap: 14px; margin-bottom: 28px; }
.role-feature { display: flex; gap: 12px; align-items: flex-start; }
.role-feature-check {
  flex-shrink: 0;
  width: 22px; height: 22px; border-radius: 7px;
  background: var(--accent-soft); color: var(--accent-strong);
  display: grid; place-items: center;
  font-size: 13px; font-weight: 700;
  margin-top: 1px;
}
.role-feature-text { font-size: 15px; line-height: 1.5; color: var(--fg); }
.role-feature-text strong { font-weight: 600; }
.role-feature-text span { color: var(--fg2); display: block; margin-top: 2px; font-size: 14px; }

.role-preview {
  position: relative;
  border-radius: var(--radius-lg);
  background: var(--card);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  min-height: 520px;
}
.preview-chrome {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.preview-chrome-dots { display: flex; gap: 6px; }
.preview-chrome-dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
.preview-chrome-url {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 5px 12px;
  font-size: 12px; color: var(--fg3);
  font-family: 'SF Mono', Consolas, monospace;
}
.preview-chrome-url b { color: var(--fg2); font-weight: 500; }

.features-section { background: var(--bg); }
.feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.feature-card {
  padding: 28px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  transition: all 0.2s;
}
.feature-card:hover { border-color: var(--accent-line); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.feature-card-icon {
  width: 44px; height: 44px; border-radius: 11px;
  background: var(--accent-soft); color: var(--accent-strong);
  display: grid; place-items: center;
  font-size: 22px;
  margin-bottom: 18px;
}
.feature-card h4 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
.feature-card p { font-size: 14.5px; color: var(--fg2); line-height: 1.55; }

.flow-section { background: var(--bg2); }
.flow-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.flow-step-num {
  display: inline-grid; place-items: center;
  width: 36px; height: 36px; border-radius: 11px;
  background: var(--card); border: 1px solid var(--border);
  font-size: 14px; font-weight: 600; color: var(--accent-strong);
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.flow-step h5 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.flow-step p { font-size: 14px; color: var(--fg2); line-height: 1.5; }

.pricing-section { background: var(--bg); }
.pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.price-card { padding: 32px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); display: flex; flex-direction: column; }
.price-card-featured { border: 2px solid var(--fg); background: var(--fg); color: #fff; box-shadow: var(--shadow-lg); transform: translateY(-6px); }
.price-card-tier { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-strong); margin-bottom: 8px; }
.price-card-featured .price-card-tier { color: oklch(0.78 0.12 240); }
.price-card-name { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; margin-bottom: 6px; }
.price-card-desc { font-size: 14px; color: var(--fg2); margin-bottom: 24px; line-height: 1.5; }
.price-card-featured .price-card-desc { color: oklch(0.75 0.02 250); }
.price-card-amount { display: flex; align-items: baseline; gap: 6px; margin-bottom: 26px; }
.price-card-amount strong { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; }
.price-card-amount span { font-size: 14px; color: var(--fg3); }
.price-card-featured .price-card-amount span { color: oklch(0.7 0.02 250); }
.price-card-list { list-style: none; display: grid; gap: 11px; margin-bottom: 28px; flex: 1; }
.price-card-list li { font-size: 14px; line-height: 1.5; display: flex; gap: 10px; align-items: flex-start; }
.price-card-list li::before { content: '✓'; color: var(--accent); font-weight: 700; flex-shrink: 0; }
.price-card-featured .price-card-list li::before { color: oklch(0.78 0.12 240); }
.price-card-cta { padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; border: 1px solid var(--border-strong); background: var(--card); color: var(--fg); transition: all 0.15s; }
.price-card-cta:hover { background: var(--bg2); }
.price-card-featured .price-card-cta { background: oklch(1 0 0); color: var(--fg); border-color: transparent; }
.price-card-featured .price-card-cta:hover { background: oklch(0.96 0.005 250); }

.cta-section {
  padding: 96px 28px;
  background:
    radial-gradient(ellipse 50% 70% at 80% 30%, oklch(0.94 0.07 240 / 0.6), transparent 65%),
    radial-gradient(ellipse 50% 70% at 20% 70%, oklch(0.95 0.05 200 / 0.5), transparent 65%),
    var(--bg2);
}
.cta-card {
  max-width: 1000px; margin: 0 auto;
  padding: 64px 56px;
  border-radius: var(--radius-lg);
  background: linear-gradient(140deg, var(--fg) 0%, oklch(0.22 0.04 250) 100%);
  color: #fff;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.cta-card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 80% at 50% 0%, oklch(0.55 0.16 240 / 0.35), transparent 60%); pointer-events: none; }
.cta-card > * { position: relative; z-index: 1; }
.cta-card h2 { font-size: clamp(30px, 3.6vw, 44px); font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; margin-bottom: 14px; text-wrap: balance; }
.cta-card p { font-size: 17px; color: oklch(0.78 0.02 250); max-width: 580px; margin: 0 auto 28px; }
.cta-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-cta-primary { padding: 14px 26px; border-radius: 11px; background: oklch(1 0 0); color: var(--fg); font-size: 15px; font-weight: 600; }
.btn-cta-secondary { padding: 14px 26px; border-radius: 11px; background: oklch(1 0 0 / 0.1); color: #fff; font-size: 15px; font-weight: 600; border: 1px solid oklch(1 0 0 / 0.18); }

.footer { border-top: 1px solid var(--border); padding: 48px 28px 32px; background: var(--bg); }
.footer-inner { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 40px; }
.footer-col h6 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg3); margin-bottom: 14px; }
.footer-col a { display: block; padding: 5px 0; font-size: 14px; color: var(--fg2); transition: color 0.15s; }
.footer-col a:hover { color: var(--fg); }
.footer-tagline { font-size: 14px; color: var(--fg2); line-height: 1.55; margin-top: 12px; max-width: 320px; }
.footer-bottom { max-width: 1240px; margin: 32px auto 0; padding-top: 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 13px; color: var(--fg3); }

@media (max-width: 980px) {
  .hero-inner, .role-stage { grid-template-columns: 1fr; gap: 40px; }
  .feature-grid, .pricing-grid { grid-template-columns: 1fr; }
  .flow-grid { grid-template-columns: 1fr 1fr; }
  .stats-strip-inner { grid-template-columns: 1fr 1fr; gap: 20px; }
  .footer-inner { grid-template-columns: 1fr 1fr; }
  .roles-tabs { overflow-x: auto; flex-wrap: nowrap; }
  section { padding: 64px 24px; }
}
@media (max-width: 600px) {
  .nav-links { display: none; }
  .hero { padding: 48px 20px 32px; }
  .cta-card { padding: 40px 24px; }
}

</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
