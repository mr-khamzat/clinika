<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание (4 колонки) — СклифЛаб (прототип v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f9fb;
  --surface: #ffffff;
  --border: #e6e8ed;
  --border-strong: #d4d7de;
  --text: #1a1d23;
  --text-soft: #5a6270;
  --text-mute: #8b92a0;
  --accent: #0e7490;
  --accent-light: #e0f7fa;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 12px rgba(15,23,42,0.06);
}
html, body { height: 100%; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: var(--text); background: var(--bg); font-size: 14px; }

/* ── HEADER ───────────────────────────────────────────── */
.header { height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 24px; box-shadow: var(--shadow-sm); z-index: 10; position: relative; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: var(--accent); }
.logo .ti { font-size: 24px; }
.header-spacer { flex: 1; }
.header-user { display: flex; align-items: center; gap: 14px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent; color: var(--text-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; }
.icon-btn:hover { background: var(--bg); }
.icon-btn .badge { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; border: 2px solid var(--surface); }
.user-info { display: flex; align-items: center; gap: 10px; padding: 4px 10px 4px 4px; border-radius: 999px; cursor: pointer; }
.user-info:hover { background: var(--bg); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #14b8a6, #0e7490); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.user-name { font-size: 13px; font-weight: 500; }

/* ── LAYOUT ───────────────────────────────────────────── */
.layout { display: flex; height: calc(100vh - 56px); }
.sidebar { width: 200px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; color: var(--text-soft); cursor: pointer; transition: all 0.15s; }
.nav-item .ti { font-size: 18px; }
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
.work-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ── WORK HEADER ──────────────────────────────────────── */
.work-header { height: 60px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-mute); }
.crumbs strong { color: var(--text); font-size: 17px; font-weight: 600; }
.crumbs .ti { font-size: 14px; }
.btn-primary { padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; transition: all 0.15s; }
.btn-primary:hover { background: #0a5b73; box-shadow: var(--shadow-md); }
.btn-primary .ti { font-size: 17px; }
.view-toggle { display: flex; gap: 4px; background: var(--bg); padding: 3px; border-radius: 10px; margin-right: 12px; }
.view-toggle button { padding: 6px 12px; background: transparent; border: none; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--text-mute); cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; }
.view-toggle button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.view-toggle .ti { font-size: 15px; }
.work-header-right { display: flex; align-items: center; }

/* ── SCHEDULE LAYOUT ──────────────────────────────────── */
.schedule { display: flex; flex: 1; min-height: 0; }

/* ── DOCTORS PANEL ────────────────────────────────────── */
.doctors-panel { width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.doctors-search { padding: 12px; border-bottom: 1px solid var(--border); }
.search-box { position: relative; }
.search-box .ti { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-mute); font-size: 17px; }
.search-box input { width: 100%; padding: 8px 10px 8px 34px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; }
.search-box input:focus { border-color: var(--accent); }
.doctors-list { flex: 1; overflow-y: auto; padding: 4px; }
.doctor-card { padding: 10px; border-radius: 10px; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; gap: 6px; margin-bottom: 2px; }
.doctor-card:hover { background: var(--bg); }
.doctor-card.active { background: var(--accent-light); }
.doctor-card-row { display: flex; align-items: center; gap: 10px; }
.doctor-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 12px; flex-shrink: 0; }
.doctor-meta { flex: 1; min-width: 0; }
.doctor-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doctor-speciality { font-size: 11px; color: var(--text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doctor-load { display: flex; align-items: center; gap: 8px; padding-top: 2px; }
.load-bar { flex: 1; height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
.load-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.load-count { font-size: 10px; color: var(--text-mute); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ── SLOTS PANEL ──────────────────────────────────────── */
.slots-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.slots-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
.slots-doctor { display: flex; align-items: center; gap: 14px; }
.slots-doctor .doctor-avatar { width: 44px; height: 44px; font-size: 14px; }
.slots-doctor-info { flex: 1; }
.slots-doctor-name { font-size: 17px; font-weight: 700; }
.slots-doctor-speciality { font-size: 13px; color: var(--text-soft); }
.slots-metrics { display: flex; gap: 24px; }
.metric { text-align: right; }
.metric-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.metric-label { font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.04em; }
.metric.confirmed .metric-value { color: #059669; }
.metric.pending .metric-value { color: #d97706; }
.metric.free .metric-value { color: var(--text-mute); }
.weekdays { display: flex; gap: 6px; padding-top: 4px; }
.weekday { flex: 1; padding: 8px 10px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid var(--border); background: var(--surface); transition: all 0.15s; }
.weekday:hover { border-color: var(--accent); }
.weekday.active { background: var(--accent); border-color: var(--accent); color: white; }
.weekday-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.weekday.active .weekday-name { color: rgba(255,255,255,0.85); }
.weekday-date { font-size: 15px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.weekday.today:not(.active) .weekday-date { color: var(--accent); }

/* ── SLOTS GRID (4 на строку) ─────────────────────────── */
.slots-grid { flex: 1; overflow-y: auto; padding: 16px 20px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-content: start; }

/* Карточка слота (компактная) */
.slot-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; position: relative; transition: all 0.15s; min-height: 110px; }
.slot-cell.colored { border-left: 4px solid; }
.slot-cell.colored:hover { box-shadow: var(--shadow-md); }
.slot-cell.cancelled { opacity: 0.65; }
.slot-cell.cancelled .slot-patient-name { text-decoration: line-through; color: var(--text-mute); }
.slot-cell.cancelled .slot-service { color: var(--text-mute); }

.slot-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.slot-time { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.slot-cell .status-chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 999px; font-size: 10px; font-weight: 600; white-space: nowrap; }
.slot-cell .status-chip .ti { font-size: 11px; }
.status-confirmed { background: #ecfdf5; color: #047857; }
.status-pending { background: #fef3c7; color: #92400e; }
.status-new { background: #ede9fe; color: #6d28d9; }
.status-cancelled { background: #f1f5f9; color: #64748b; }
.status-no_show { background: #fce7f3; color: #be185d; }

.slot-patient-line { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
.slot-patient-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-patient-age { font-size: 11px; color: var(--text-mute); flex-shrink: 0; }
.slot-service { font-size: 12px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-bottom { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: auto; padding-top: 4px; }
.slot-phone { font-size: 11px; color: var(--text-mute); font-variant-numeric: tabular-nums; }
.pay-tag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 5px; border-radius: 4px; font-size: 10px; font-weight: 600; background: #ecfdf5; color: #047857; flex-shrink: 0; }
.pay-tag.dms { background: #eff6ff; color: #1d4ed8; }
.pay-tag .ti { font-size: 11px; }

/* Free slot */
.slot-cell.free { background: transparent; border: 1px dashed var(--border-strong); align-items: center; justify-content: center; cursor: pointer; color: var(--text-mute); min-height: 110px; }
.slot-cell.free .slot-top { width: 100%; }
.slot-cell.free .slot-free-text { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; justify-content: center; }
.slot-cell.free .ti-plus { font-size: 22px; }
.slot-cell.free:hover { border-color: var(--accent); border-style: solid; color: var(--accent); background: rgba(14,116,144,0.04); }

/* NOW — точка-индикатор на ячейке + рамка */
.slot-cell.now { box-shadow: 0 0 0 2px #ef4444, var(--shadow-md); }
.slot-cell.now::after { content: ''; position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: #ef4444; border: 2px solid var(--surface); box-shadow: 0 0 0 4px rgba(239,68,68,0.18); }
.slot-cell.now .slot-time { color: #dc2626; }

/* Часовая разделительная полоса — каждые 4 слота (= 2 часа на ряд) */
.hour-marker { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 6px 0 2px; font-size: 11px; font-weight: 600; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.04em; }
.hour-marker::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.hour-marker:first-child { padding-top: 0; }

/* ── RESPONSIVE ───────────────────────────────────────── */
@media (max-width: 1280px) {
  .slots-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 980px) {
  .slots-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 768px) {
  .sidebar { display: none; }
  .doctors-panel { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .doctors-list { display: flex; overflow-x: auto; overflow-y: hidden; padding: 12px; gap: 8px; }
  .doctor-card { flex-shrink: 0; min-width: 200px; }
  .schedule { flex-direction: column; }
  .slots-grid { grid-template-columns: 1fr; }
  .work-header { padding: 0 14px; }
  .slots-metrics { flex-wrap: wrap; gap: 14px; }
}
</style>
</head>

  confirmed: { label: 'Подтв.',  cls: 'status-confirmed', icon: 'ti-circle-check' },

  cancelled: { label: 'Отменён', cls: 'status-cancelled', icon: 'ti-x' },
}

function buildSlots(start, end) {
  const out = []
  let [h, m] = start.split(':').map(Number)
  const [eh, em] = end.split(':').map(Number)
  while (h < eh || (h === eh && m < em)) {
    out.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`)
    m += 30
    if (m >= 60) { m -= 60; h += 1 }

  return out

const NOW_TIME = '10:30'

let activeDoctorId = 'd1'
let activeDay = 'tue'
let searchQuery = ''

function renderDoctors() {
  const list = document.getElementById('doctorsList')
  const q = searchQuery.toLowerCase().trim()
  const filtered = DOCTORS.filter(d => !q || d.name.toLowerCase().includes(q) || d.speciality.toLowerCase().includes(q))
  list.innerHTML = filtered.map(d => {
    const appts = APPOINTMENTS[d.id] || []
    const slotsCount = buildSlots('09:00', '18:00').length
    const loadPct = Math.min(100, Math.round(appts.length / slotsCount * 100))
    return `
      <div class="doctor-card ${d.id === activeDoctorId ? 'active' : ''}" data-id="${d.id}">
        <div class="doctor-card-row">
          <div class="doctor-avatar" style="background:${d.color}">${d.short}</div>
          <div class="doctor-meta">
            <div class="doctor-name">${d.name}</div>
            <div class="doctor-speciality">${d.speciality}</div>
          </div>
        </div>
        <div class="doctor-load">
          <div class="load-bar"><div class="load-fill" style="width:${loadPct}%;background:${d.color}"></div></div>
          <div class="load-count">${appts.length}/${slotsCount}</div>
        </div>
      </div>
    `
  }).join('')
  list.querySelectorAll('.doctor-card').forEach(el => {
    el.addEventListener('click', () => { activeDoctorId = el.dataset.id; render() })
  })
}

function renderHeader() {
  const d = DOCTORS.find(x => x.id === activeDoctorId)
  if (!d) return
  document.getElementById('hdrDocAvatar').textContent = d.short
  document.getElementById('hdrDocAvatar').style.background = d.color
  document.getElementById('hdrDocName').textContent = d.name
  document.getElementById('hdrDocSpec').textContent = d.speciality
  const appts = APPOINTMENTS[d.id] || []
  const slotsCount = buildSlots('09:00', '18:00').length
  const confirmed = appts.filter(a => a.status === 'confirmed').length
  const pending = appts.filter(a => a.status === 'pending' || a.status === 'new').length
  const free = slotsCount - appts.length
  document.getElementById('hdrMetrics').innerHTML = `
    <div class="metric"><div class="metric-value">${appts.length}</div><div class="metric-label">Всего</div></div>
    <div class="metric confirmed"><div class="metric-value">${confirmed}</div><div class="metric-label">Подтв.</div></div>
    <div class="metric pending"><div class="metric-value">${pending}</div><div class="metric-label">Ожидают</div></div>
    <div class="metric free"><div class="metric-value">${free}</div><div class="metric-label">Свободно</div></div>
  `
}

function renderWeekdays() {
  const days = [
    { key: 'mon', name: 'Пн', date: 18 },
    { key: 'tue', name: 'Вт', date: 19, today: true },
    { key: 'wed', name: 'Ср', date: 20 },
    { key: 'thu', name: 'Чт', date: 21 },
    { key: 'fri', name: 'Пт', date: 22 },
    { key: 'sat', name: 'Сб', date: 23 },
    { key: 'sun', name: 'Вс', date: 24 },
  ]
  document.getElementById('weekdays').innerHTML = days.map(d => `
    <div class="weekday ${d.key === activeDay ? 'active' : ''} ${d.today ? 'today' : ''}" data-day="${d.key}">
      <div class="weekday-name">${d.name}</div>
      <div class="weekday-date">${d.date}</div>
    </div>
  `).join('')
  document.querySelectorAll('.weekday').forEach(el => {
    el.addEventListener('click', () => { activeDay = el.dataset.day; renderWeekdays() })
  })
}

function renderSlots() {
  const d = DOCTORS.find(x => x.id === activeDoctorId)
  const slots = buildSlots('09:00', '18:00')
  const appts = APPOINTMENTS[d.id] || []
  const byTime = Object.fromEntries(appts.map(a => [a.time, a]))

  const grid = document.getElementById('slotsGrid')
  let html = ''
  let lastHour = -1

  slots.forEach(t => {
    const h = parseInt(t.slice(0, 2), 10)
    // Каждые 2 часа — divider (visually делит ряды по часам)
    if (h !== lastHour && h % 2 === 0) {
      html += `<div class="hour-marker">${String(h).padStart(2,'0')}:00 — ${String(h + 2).padStart(2,'0')}:00</div>`
      lastHour = h
    }
    const a = byTime[t]
    const isNow = t === NOW_TIME
    if (a) {
      const st = STATUSES[a.status]
      const isCancelled = a.status === 'cancelled'
      const borderStyle = isCancelled ? '' : `border-left-color:${d.color}`
      html += `
        <div class="slot-cell colored ${isCancelled ? 'cancelled' : ''} ${isNow ? 'now' : ''}" style="${borderStyle}">
          <div class="slot-top">
            <span class="slot-time">${t}</span>
            <span class="status-chip ${st.cls}"><i class="ti ${st.icon}"></i>${st.label}</span>
          </div>
          <div class="slot-patient-line">
            <span class="slot-patient-name">${a.patient}</span>
            <span class="slot-patient-age">${a.age}л</span>
          </div>
          <div class="slot-service">${a.service}</div>
          <div class="slot-bottom">
            <span class="slot-phone">${a.phone}</span>
            <span class="pay-tag ${a.pay.cls}"><i class="ti ${a.pay.icon}"></i>${a.pay.label}</span>
          </div>
        </div>
      `
    } else {
      html += `
        <div class="slot-cell free ${isNow ? 'now' : ''}">
          <div class="slot-top"><span class="slot-time">${t}</span></div>
          <div class="slot-free-text"><i class="ti ti-plus"></i><span>Свободно</span></div>
        </div>
      `
    }
  })
  grid.innerHTML = html
}

function render() {
  renderDoctors()
  renderHeader()
  renderSlots()
}

document.getElementById('doctorSearch').addEventListener('input', e => { searchQuery = e.target.value; renderDoctors() })
renderWeekdays()
render()
</script>
