<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание + Карточка приёма — СклифЛаб (прототип v3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f9fb;
  --surface: #ffffff;
  --border: #e6e8ed;
  --border-strong: #d4d7de;
  --text: #1a1d23;
  --text-soft: #5a6270;
  --text-mute: #8b92a0;
  --accent: #0e7490;
  --accent-light: #e0f7fa;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 12px rgba(15,23,42,0.06);
  --shadow-lg: 0 20px 50px rgba(15,23,42,0.15);
}
html, body { height: 100%; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: var(--text); background: var(--bg); font-size: 14px; }

/* ── HEADER ───────────────────────────────────────────── */
.header { height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 24px; box-shadow: var(--shadow-sm); z-index: 10; position: relative; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: var(--accent); }
.logo .ti { font-size: 24px; }
.header-spacer { flex: 1; }
.header-user { display: flex; align-items: center; gap: 14px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent; color: var(--text-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; }
.icon-btn:hover { background: var(--bg); }
.icon-btn .badge { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; border: 2px solid var(--surface); }
.user-info { display: flex; align-items: center; gap: 10px; padding: 4px 10px 4px 4px; border-radius: 999px; cursor: pointer; }
.user-info:hover { background: var(--bg); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #14b8a6, #0e7490); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.user-name { font-size: 13px; font-weight: 500; }

/* ── LAYOUT ───────────────────────────────────────────── */
.layout { display: flex; height: calc(100vh - 56px); }
.sidebar { width: 200px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; color: var(--text-soft); cursor: pointer; transition: all 0.15s; }
.nav-item .ti { font-size: 18px; }
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
.work-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ── WORK HEADER ──────────────────────────────────────── */
.work-header { height: 60px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 12px; }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-mute); }
.crumbs strong { color: var(--text); font-size: 17px; font-weight: 600; }
.crumbs .ti { font-size: 14px; }
.btn-primary { padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; transition: all 0.15s; }
.btn-primary:hover { background: #0a5b73; box-shadow: var(--shadow-md); }
.btn-primary .ti { font-size: 17px; }
.btn-secondary { padding: 8px 16px; background: transparent; color: var(--text-soft); border: 1px solid var(--border); border-radius: 10px; font-weight: 600; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; }
.btn-secondary:hover { background: var(--bg); color: var(--text); }
.btn-success { background: #059669; color: white; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; }
.btn-success:hover { background: #047857; }
.btn-danger { background: transparent; color: #dc2626; border: 1px solid #fecaca; padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; }
.btn-danger:hover { background: #fef2f2; }

/* ── SCHEDULE LAYOUT ──────────────────────────────────── */
.schedule { display: flex; flex: 1; min-height: 0; }
.doctors-panel { width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.doctors-search { padding: 12px; border-bottom: 1px solid var(--border); }
.search-box { position: relative; }
.search-box .ti { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-mute); font-size: 17px; }
.search-box input { width: 100%; padding: 8px 10px 8px 34px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; }
.search-box input:focus { border-color: var(--accent); }
.doctors-list { flex: 1; overflow-y: auto; padding: 4px; }
.doctor-card { padding: 10px; border-radius: 10px; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; gap: 6px; margin-bottom: 2px; }
.doctor-card:hover { background: var(--bg); }
.doctor-card.active { background: var(--accent-light); }
.doctor-card-row { display: flex; align-items: center; gap: 10px; }
.doctor-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 12px; flex-shrink: 0; }
.doctor-meta { flex: 1; min-width: 0; }
.doctor-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doctor-speciality { font-size: 11px; color: var(--text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doctor-load { display: flex; align-items: center; gap: 8px; padding-top: 2px; }
.load-bar { flex: 1; height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
.load-fill { height: 100%; border-radius: 4px; }
.load-count { font-size: 10px; color: var(--text-mute); font-weight: 600; font-variant-numeric: tabular-nums; }

.slots-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.slots-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
.slots-doctor { display: flex; align-items: center; gap: 14px; }
.slots-doctor .doctor-avatar { width: 44px; height: 44px; font-size: 14px; }
.slots-doctor-info { flex: 1; }
.slots-doctor-name { font-size: 17px; font-weight: 700; }
.slots-doctor-speciality { font-size: 13px; color: var(--text-soft); }
.slots-metrics { display: flex; gap: 24px; }
.metric { text-align: right; }
.metric-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.metric-label { font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.04em; }
.metric.confirmed .metric-value { color: #059669; }
.metric.pending .metric-value { color: #d97706; }
.metric.free .metric-value { color: var(--text-mute); }
.weekdays { display: flex; gap: 6px; padding-top: 4px; }
.weekday { flex: 1; padding: 8px 10px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid var(--border); background: var(--surface); transition: all 0.15s; }
.weekday:hover { border-color: var(--accent); }
.weekday.active { background: var(--accent); border-color: var(--accent); color: white; }
.weekday-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.weekday.active .weekday-name { color: rgba(255,255,255,0.85); }
.weekday-date { font-size: 15px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.weekday.today:not(.active) .weekday-date { color: var(--accent); }

/* ── SLOTS GRID (4 на строку) ─────────────────────────── */
.slots-grid { flex: 1; overflow-y: auto; padding: 16px 20px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-content: start; }
.slot-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; position: relative; transition: all 0.15s; min-height: 110px; cursor: pointer; }
.slot-cell.colored { border-left: 4px solid; }
.slot-cell.colored:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.slot-cell.cancelled { opacity: 0.65; }
.slot-cell.cancelled .slot-patient-name { text-decoration: line-through; color: var(--text-mute); }
.slot-cell.completed { background: linear-gradient(180deg, rgba(5,150,105,0.04), transparent); }
.slot-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.slot-time { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.slot-cell .status-chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 999px; font-size: 10px; font-weight: 600; white-space: nowrap; }
.slot-cell .status-chip .ti { font-size: 11px; }
.status-confirmed { background: #ecfdf5; color: #047857; }
.status-pending { background: #fef3c7; color: #92400e; }
.status-new { background: #ede9fe; color: #6d28d9; }
.status-cancelled { background: #f1f5f9; color: #64748b; }
.status-completed { background: #dbeafe; color: #1d4ed8; }
.slot-patient-line { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
.slot-patient-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-patient-age { font-size: 11px; color: var(--text-mute); flex-shrink: 0; }
.slot-service { font-size: 12px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-bottom { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: auto; padding-top: 4px; }
.slot-phone { font-size: 11px; color: var(--text-mute); font-variant-numeric: tabular-nums; }
.pay-tag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 5px; border-radius: 4px; font-size: 10px; font-weight: 600; background: #ecfdf5; color: #047857; flex-shrink: 0; }
.pay-tag.dms { background: #eff6ff; color: #1d4ed8; }
.pay-tag .ti { font-size: 11px; }
.slot-cell.has-emr::after { content: '📄'; position: absolute; bottom: 6px; right: 8px; font-size: 11px; opacity: 0.6; }
.slot-cell.free { background: transparent; border: 1px dashed var(--border-strong); align-items: center; justify-content: center; color: var(--text-mute); min-height: 110px; }
.slot-cell.free .slot-top { width: 100%; }
.slot-cell.free .slot-free-text { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; justify-content: center; }
.slot-cell.free .ti-plus { font-size: 22px; }
.slot-cell.free:hover { border-color: var(--accent); border-style: solid; color: var(--accent); background: rgba(14,116,144,0.04); }
.slot-cell.now { box-shadow: 0 0 0 2px #ef4444, var(--shadow-md); }
.slot-cell.now::before { content: ''; position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: #ef4444; border: 2px solid var(--surface); box-shadow: 0 0 0 4px rgba(239,68,68,0.18); }
.hour-marker { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 6px 0 2px; font-size: 11px; font-weight: 600; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.04em; }
.hour-marker::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.hour-marker:first-child { padding-top: 0; }

/* ── MODAL ────────────────────────────────────────────── */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.4); backdrop-filter: blur(2px); z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; animation: fadeIn 0.15s; }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.modal { width: 100%; max-width: 900px; max-height: 92vh; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; animation: slideUp 0.2s cubic-bezier(.22,1,.36,1); }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
.modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
.modal-header .doctor-avatar { width: 48px; height: 48px; font-size: 14px; }
.modal-header-info { flex: 1; min-width: 0; }
.modal-header-name { font-size: 17px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.modal-header-name .age { font-size: 13px; font-weight: 500; color: var(--text-mute); }
.modal-header-meta { font-size: 13px; color: var(--text-soft); margin-top: 3px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.modal-header-meta .ti { font-size: 14px; vertical-align: -2px; }
.modal-close { width: 38px; height: 38px; border-radius: 10px; background: transparent; border: none; cursor: pointer; color: var(--text-mute); font-size: 22px; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: var(--bg); color: var(--text); }
.modal-tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--border); }
.tab { padding: 12px 14px; background: transparent; border: none; font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--text-soft); cursor: pointer; display: flex; align-items: center; gap: 6px; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
.tab .ti { font-size: 17px; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab .badge-count { background: var(--bg); color: var(--text-mute); padding: 1px 6px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.tab.active .badge-count { background: var(--accent-light); color: var(--accent); }
.modal-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
.modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal-footer .group { display: flex; gap: 8px; }

/* ── Tab content ──────────────────────────────────────── */
.field-group { display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-soft); display: flex; align-items: center; gap: 6px; }
.field-label .ti { font-size: 14px; }
.field textarea, .field input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 90px; line-height: 1.5; outline: none; transition: border 0.15s; background: var(--surface); }
.field textarea:focus, .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,116,144,0.12); }
.field .hint { font-size: 11.5px; color: var(--text-mute); }

/* Files */
.dropzone { border: 2px dashed var(--border-strong); border-radius: 12px; padding: 24px; text-align: center; color: var(--text-mute); cursor: pointer; transition: all 0.15s; background: var(--bg); }
.dropzone:hover { border-color: var(--accent); color: var(--accent); background: rgba(14,116,144,0.04); }
.dropzone .ti { font-size: 32px; display: block; margin-bottom: 8px; }
.dropzone-title { font-size: 14px; font-weight: 600; }
.dropzone-hint { font-size: 12px; margin-top: 4px; }
.files-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.file-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.file-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--accent); flex-shrink: 0; }
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-meta { font-size: 11.5px; color: var(--text-mute); margin-top: 2px; }
.file-actions { display: flex; gap: 4px; }
.icon-action { width: 30px; height: 30px; border-radius: 7px; background: transparent; border: none; color: var(--text-mute); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; }
.icon-action:hover { background: var(--bg); color: var(--text); }
.icon-action.danger:hover { background: #fef2f2; color: #dc2626; }

/* Направления */
.referrals-list { display: flex; flex-direction: column; gap: 8px; }
.referral-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; }
.referral-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.referral-info { flex: 1; min-width: 0; }
.referral-title { font-size: 13.5px; font-weight: 600; }
.referral-target { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
.referral-status { font-size: 11px; padding: 3px 8px; border-radius: 999px; font-weight: 600; }
.add-referral-btn { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px dashed var(--border-strong); border-radius: 10px; background: transparent; cursor: pointer; color: var(--text-mute); font-family: inherit; font-size: 13.5px; font-weight: 600; width: 100%; justify-content: center; transition: all 0.15s; }
.add-referral-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(14,116,144,0.04); }

/* История */
.timeline { display: flex; flex-direction: column; gap: 14px; }
.timeline-item { display: flex; gap: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.timeline-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
.timeline-content { flex: 1; min-width: 0; }
.timeline-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.timeline-date { font-size: 13.5px; font-weight: 700; color: var(--text); }
.timeline-clinic { font-size: 11.5px; color: var(--text-mute); margin-left: 4px; font-weight: 500; }
.timeline-doctor { font-size: 12.5px; color: var(--text-soft); margin-top: 4px; }
.timeline-service { font-size: 12.5px; color: var(--text); margin-top: 2px; font-weight: 500; }
.timeline-conclusion { font-size: 12px; color: var(--text-soft); margin-top: 6px; padding: 8px 10px; background: var(--bg); border-radius: 8px; line-height: 1.5; }

@media (max-width: 1280px) { .slots-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 980px) { .slots-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 768px) {
  .sidebar { display: none; }
  .doctors-panel { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .doctors-list { display: flex; overflow-x: auto; overflow-y: hidden; padding: 12px; gap: 8px; }
  .doctor-card { flex-shrink: 0; min-width: 200px; }
  .schedule { flex-direction: column; }
  .slots-grid { grid-template-columns: 1fr; }
  .work-header { padding: 0 14px; }
  .slots-metrics { flex-wrap: wrap; gap: 14px; }
  .modal { max-height: 100vh; border-radius: 0; }
  .modal-overlay { padding: 0; }
  .modal-tabs { padding: 0 14px; overflow-x: auto; }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo"><i class="ti ti-medical-cross-circle"></i>СклифЛаб</div>
  <div class="header-spacer"></div>
  <div class="header-user">
    <button class="icon-btn" title="Поиск"><i class="ti ti-search"></i></button>
    <button class="icon-btn" title="Уведомления"><i class="ti ti-bell"></i><span class="badge"></span></button>
    <div class="user-info">
      <div class="user-avatar">КМ</div>
      <div class="user-name">д-р Куракаева М.А.</div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="nav-item active"><i class="ti ti-calendar-event"></i>Расписание</div>
    <div class="nav-item"><i class="ti ti-users"></i>Пациенты</div>
    <div class="nav-item"><i class="ti ti-files"></i>Документы</div>
    <div class="nav-item"><i class="ti ti-chart-bar"></i>Аналитика</div>
    <div class="nav-item"><i class="ti ti-settings"></i>Настройки</div>
    <div class="sidebar-footer">
      <div class="nav-item"><i class="ti ti-logout"></i>Выйти</div>
    </div>
  </aside>

  <main class="work-area">
    <div class="work-header">
      <div class="crumbs">Менеджер<i class="ti ti-chevron-right"></i><strong>Расписание</strong></div>

function buildSlots(start, end) {
  const out = []
  let [h, m] = start.split(':').map(Number)
  const [eh, em] = end.split(':').map(Number)
  while (h < eh || (h === eh && m < em)) {
    out.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`)
    m += 30; if (m >= 60) { m -= 60; h += 1 }
  }
  return out
}

function renderDoctors() {
  const list = document.getElementById('doctorsList')
  const q = searchQuery.toLowerCase().trim()
  const filtered = DOCTORS.filter(d => !q || d.name.toLowerCase().includes(q) || d.speciality.toLowerCase().includes(q))
  list.innerHTML = filtered.map(d => {
    const appts = APPOINTMENTS[d.id] || []
    const slotsCount = buildSlots('09:00', '18:00').length
    const loadPct = Math.min(100, Math.round(appts.length / slotsCount * 100))
    return `
      <div class="doctor-card ${d.id === activeDoctorId ? 'active' : ''}" data-id="${d.id}">
        <div class="doctor-card-row">
          <div class="doctor-avatar" style="background:${d.color}">${d.short}</div>
          <div class="doctor-meta">
            <div class="doctor-name">${d.name}</div>
            <div class="doctor-speciality">${d.speciality}</div>
          </div>
        </div>
        <div class="doctor-load">
          <div class="load-bar"><div class="load-fill" style="width:${loadPct}%;background:${d.color}"></div></div>
          <div class="load-count">${appts.length}/${slotsCount}</div>
        </div>
      </div>
    `
  }).join('')
  list.querySelectorAll('.doctor-card').forEach(el => {
    el.addEventListener('click', () => { activeDoctorId = el.dataset.id; render() })
  })
}

function renderHeader() {
  const d = DOCTORS.find(x => x.id === activeDoctorId)

function renderSlots() {
  const d = DOCTORS.find(x => x.id === activeDoctorId)
  const slots = buildSlots('09:00', '18:00')
  const appts = APPOINTMENTS[d.id] || []
  const byTime = Object.fromEntries(appts.map(a => [a.time, a]))
  const grid = document.getElementById('slotsGrid')
  let html = ''; let lastHour = -1
  slots.forEach(t => {
    const h = parseInt(t.slice(0, 2), 10)
    if (h !== lastHour && h % 2 === 0) {
      html += `<div class="hour-marker">${String(h).padStart(2,'0')}:00 — ${String(h+2).padStart(2,'0')}:00</div>`
      lastHour = h
    }
    const a = byTime[t]; const isNow = t === NOW_TIME
    if (a) {
      const st = STATUSES[a.status]
      const isCancelled = a.status === 'cancelled'
      const borderStyle = isCancelled ? '' : `border-left-color:${d.color}`
      html += `
        <div class="slot-cell colored ${isCancelled ? 'cancelled' : ''} ${a.status === 'completed' ? 'completed' : ''} ${a.has_emr ? 'has-emr' : ''} ${isNow ? 'now' : ''}" style="${borderStyle}" data-apt="${a.id}">
          <div class="slot-top">
            <span class="slot-time">${t}</span>
            <span class="status-chip ${st.cls}"><i class="ti ${st.icon}"></i>${st.label}</span>
          </div>
          <div class="slot-patient-line">
            <span class="slot-patient-name">${a.patient}</span>
            <span class="slot-patient-age">${a.age}л</span>
          </div>
          <div class="slot-service">${a.service}</div>
          <div class="slot-bottom">
            <span class="slot-phone">${a.phone}</span>
            <span class="pay-tag ${a.pay.cls}"><i class="ti ${a.pay.icon}"></i>${a.pay.label}</span>
          </div>
        </div>
      `
    } else {
      html += `
        <div class="slot-cell free ${isNow ? 'now' : ''}">
          <div class="slot-top"><span class="slot-time">${t}</span></div>
          <div class="slot-free-text"><i class="ti ti-plus"></i><span>Свободно</span></div>
        </div>
      `
    }
  })
  grid.innerHTML = html
  grid.querySelectorAll('.slot-cell[data-apt]').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.apt))
  })
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function findApt(id) {
  for (const [docId, list] of Object.entries(APPOINTMENTS)) {
    const a = list.find(x => x.id === id)
    if (a) return { apt: a, doctorId: docId }
  }
  return null
}

function openModal(id) {
  const found = findApt(id); if (!found) return
  activeApt = found
  activeTab = 'outcome'
  const a = found.apt
  const doc = DOC_BY_ID[found.doctorId]
  document.getElementById('modalDocAvatar').textContent = doc.short
  document.getElementById('modalDocAvatar').style.background = doc.color
  document.getElementById('modalPatientName').textContent = a.patient
  document.getElementById('modalPatientAge').textContent = `${a.age} лет`
  const st = STATUSES[a.status]
  document.getElementById('modalStatusChip').className = `status-chip ${st.cls}`
  document.getElementById('modalStatusChip').innerHTML = `<i class="ti ${st.icon}"></i>${st.label}`
  document.getElementById('modalDate').textContent = '19 мая 2026'
  document.getElementById('modalTime').textContent = a.time
  document.getElementById('modalDoctor').textContent = `${doc.name.split(' ').slice(0,2).join(' ')} · ${doc.speciality}`
  document.getElementById('modalService').textContent = a.service
  document.getElementById('modalPhone').textContent = a.phone

  document.getElementById('filesBadge').textContent = (FILES_BY_APT[a.id] || []).length
  document.getElementById('refsBadge').textContent = (REFERRALS_BY_APT[a.id] || []).length
  document.getElementById('histBadge').textContent = (PATIENT_HISTORY[a.phone] || []).length

  // Badge color по статусу: завершен = синий
  if (a.status === 'completed') {
    document.getElementById('modalComplete').innerHTML = '<i class="ti ti-rotate"></i>Открыть для правки'
  } else {
    document.getElementById('modalComplete').innerHTML = '<i class="ti ti-circle-check"></i>Завершить приём'
  }

  document.querySelectorAll('.modal-tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab))
  renderTab()
  document.getElementById('modalRoot').style.display = 'flex'
}

function closeModal() {
  document.getElementById('modalRoot').style.display = 'none'
  activeApt = null
}

function renderTab() {
  const a = activeApt.apt
  const body = document.getElementById('modalBody')
  if (activeTab === 'outcome') {
    const emr = a.emr || { diagnosis:'', complaints:'', exam:'', conclusion:'', recommendations:'' }
    body.innerHTML = `
      <div class="field-group">
        <div class="field">
          <label class="field-label"><i class="ti ti-message-circle"></i>Жалобы пациента</label>
          <textarea placeholder="Что беспокоит, как давно, что усиливает/облегчает…">${emr.complaints || ''}</textarea>
        </div>
        <div class="field">
          <label class="field-label"><i class="ti ti-stethoscope"></i>Осмотр / объективный статус</label>
          <textarea placeholder="Данные объективного осмотра, измерений, инструментальных данных…">${emr.exam || ''}</textarea>
        </div>
        <div class="field">
          <label class="field-label"><i class="ti ti-clipboard-check"></i>Диагноз (МКБ-10)</label>
          <input type="text" placeholder="Например: J35.0 Хронический тонзиллит" value="${emr.diagnosis || ''}">
          <div class="hint">Можно вводить вручную или выбрать из справочника. AI-помощник предложит варианты на основе жалоб и осмотра.</div>
        </div>
        <div class="field">
          <label class="field-label"><i class="ti ti-notes"></i>Заключение и план</label>
          <textarea placeholder="Заключение врача, проведённое лечение, динамика…" style="min-height:130px">${emr.conclusion || ''}</textarea>
        </div>
        <div class="field">
          <label class="field-label"><i class="ti ti-medical-cross"></i>Рекомендации пациенту</label>
          <textarea placeholder="Лечение, режим, диета, контрольный приём, на что обратить внимание…" style="min-height:110px">${emr.recommendations || ''}</textarea>
        </div>
      </div>
    `
  } else if (activeTab === 'files') {
    const files = FILES_BY_APT[a.id] || []
    body.innerHTML = `
      <div class="dropzone">
        <i class="ti ti-cloud-upload"></i>
        <div class="dropzone-title">Перетащите файлы сюда или нажмите для выбора</div>
        <div class="dropzone-hint">Рентген, УЗИ, анализы, заключения · PDF / JPG / PNG / DOC · до 25 МБ каждый</div>
      </div>
      <div class="files-list">
        ${files.length === 0 ? '<div class="hint" style="text-align:center;padding:16px;color:var(--text-mute)">Файлов пока нет</div>' : files.map(f => `
          <div class="file-row">
            <div class="file-icon"><i class="ti ${f.type === 'image' ? 'ti-photo' : f.type === 'pdf' ? 'ti-file-text' : 'ti-file'}"></i></div>
            <div class="file-info">
              <div class="file-name">${f.name}</div>
              <div class="file-meta">${f.size} · загружено ${f.uploaded}</div>
            </div>
            <div class="file-actions">
              <button class="icon-action" title="Скачать"><i class="ti ti-download"></i></button>
              <button class="icon-action" title="Открыть"><i class="ti ti-eye"></i></button>
              <button class="icon-action danger" title="Удалить"><i class="ti ti-trash"></i></button>
            </div>
          </div>
        `).join('')}
      </div>
    `
  } else if (activeTab === 'referrals') {
    const refs = REFERRALS_BY_APT[a.id] || []
    body.innerHTML = `
      <div class="referrals-list">
        ${refs.map(r => {
          const icons = { doctor:'ti-stethoscope', ct:'ti-monitor-heart', mri:'ti-monitor-heart', xray:'ti-radioactive', lab:'ti-test-pipe', procedure:'ti-medical-services' }
          const statusCls = r.status === 'done' ? 'status-completed' : r.status === 'scheduled' ? 'status-confirmed' : 'status-pending'
          return `
            <div class="referral-row">
              <div class="referral-icon"><i class="ti ${icons[r.type] || 'ti-route'}"></i></div>
              <div class="referral-info">
                <div class="referral-title">${r.label}</div>
                <div class="referral-target">${r.target}</div>
              </div>
              <span class="referral-status ${statusCls}">${r.statusLabel}</span>
            </div>
          `
        }).join('')}
        <button class="add-referral-btn"><i class="ti ti-plus"></i>Добавить направление (врач / КТ / МРТ / рентген / анализы / процедура)</button>
      </div>
    `
  } else if (activeTab === 'history') {
    const hist = PATIENT_HISTORY[a.phone] || []
    if (hist.length === 0) {
      body.innerHTML = `<div class="hint" style="text-align:center;padding:30px;color:var(--text-mute)">У пациента нет предыдущих приёмов в сети клиник</div>`
    } else {
      body.innerHTML = `
        <div class="timeline">
          ${hist.map(h => {
            // Цвет точки = по доктору если найдётся в DOCTORS
            const doc = DOCTORS.find(d => h.doctor.toLowerCase().includes(d.name.split(' ')[0].toLowerCase()))
            const dotColor = doc ? doc.color : '#94a3b8'
            return `
              <div class="timeline-item">
                <div class="timeline-dot" style="background:${dotColor}"></div>
                <div class="timeline-content">
                  <div class="timeline-head">
                    <div><span class="timeline-date">${h.date}</span><span class="timeline-clinic">· ${h.clinic}</span></div>
                  </div>
                  <div class="timeline-doctor">${h.doctor}</div>
                  <div class="timeline-service">${h.service}</div>
                  <div class="timeline-conclusion">${h.conclusion}</div>
                </div>
              </div>
            `
          }).join('')}
        </div>
      `
    }
  }
}

document.querySelectorAll('.modal-tabs .tab').forEach(t => {
  t.addEventListener('click', () => {
    activeTab = t.dataset.tab
    document.querySelectorAll('.modal-tabs .tab').forEach(x => x.classList.toggle('active', x === t))
    renderTab()
  })
})
document.getElementById('modalClose').addEventListener('click', closeModal)
document.getElementById('modalRoot').addEventListener('click', e => { if (e.target.id === 'modalRoot') closeModal() })
document.getElementById('modalComplete').addEventListener('click', () => {
  if (activeApt) {
    activeApt.apt.status = 'completed'
    activeApt.apt.has_emr = true
    renderSlots()
    closeModal()
  }
})

function render() {
  renderDoctors()
  renderHeader()
  renderSlots()
}

document.getElementById('doctorSearch').addEventListener('input', e => { searchQuery = e.target.value; renderDoctors() })
renderWeekdays()
render()
</script>
</body>
</html>
